<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tables and Images With Bootstrap</title>
</head>
<body>
   <h2 class="text-center">Naruto Characters - Team 7</h2>
   <div class="row">
         <img class="img rounded mx-auto d-block col-lg-4" src="https://static.wikia.nocookie.net/disneythehunchbackofnotredame/images/5/50/Young-sasuke-uchiha.jpg/revision/latest/scale-to-width-down/294?cb=20171128220358" alt="Uchiha Sasuke" height="300px" width="450px">
   
         <img class="rounded-circle mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbeKF8GdYoMhNM3d258owWPYirQQoV8vXrLimtHBq-l8QoGwdg-hyGYs8&s=10" alt="Uchiha Sakura" height="300px" width="450px">
   
         <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://static0.srcdn.com/wordpress/wp-content/uploads/2025/08/naruto-grinning.jpg" alt="uzumaki Naruto" height="300px" width="450px">
   </div>
   <h1 class="text-center">Bootstrap Table</h1>
   <img class="mx-auto d-block" src="https://wallpapers-clan.com/wp-content/uploads/2024/09/spiderman-city-vigil-pc-wallpaper-cover-1.jpg" alt="Sipderman" height="300px" width="450px">
   <table class="table table-bordered table-dark table-hover container">
    <tr>
        <th class="bg-primary" scope="col">Name</th>
        <th class="bg-primary" scope="col">Favourite anime</th>
        <th class="bg-primary" scope="col">Protagonist</th>
    </tr>
    <tr>
        <td>Jandi Galvez</td>
        <td>Apothecary Diaries</td>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx6iH9ObLzDbRDGfxM3JDXRsPlO8jGHG_Im7ayKk7m7HY4eKJ4_HgW4oWb&s=10" height="200px" width="200px"></td>
    </tr>
     <tr>
        <td>Yazni Medina</td>
        <td>Demon Slayer</td>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDF-njl6CMuEnhZ1pc8Y0uv5-q5-L5u36nBnY1esIf5w&s=10x" height="200px" width="200px"></td>
    </tr>
     <tr>
        <td>Chelsea Coronado</td>
        <td>SpyxFamily</td>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoWR2AGYaUjlZRNjOomu2xfuh6ms21tUosqRGRP3pX8JGFT7BTLG7-Y9_9&s=10" height="200px" width="200px"></td>
    </tr>
     <tr>
        <td>Sofia Navarro</td>
        <td>Jujutsu Kaisen</td>
        <td><img src="https://images.hiwaifu.com/uploads/Api/robot_avatar/202411/11758c15787a662893d951c5c7f1446f.webp" height="200px" width="200px"></td>
    </tr>

</html>
